{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-[760px] pt-6">
  <h1 class="text-[26px] font-bold tracking-tight">{{ page.title }}</h1>
  <div class="card mt-5 p-8">
    <div class="inline-flex rounded-full bg-[#eef1ff] px-3 py-1 text-[12.5px] font-semibold text-signal">Build stage {{ page.stage }}</div>
    <p class="mt-4 text-[16px] leading-relaxed">{{ page.blurb }}</p>
    <p class="mt-3 text-[14px] leading-relaxed text-mute">This page is part of a later build stage. The navigation, filters and data layer it will use are already in place.</p>
    <a href="/?{{ filters.query_string }}" data-nav="/" class="btn btn-ghost mt-6">Back to Overview</a>
  </div>
</div>
{% endblock %}
